<html>
<head>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/bootstrap.min.css">
</head>

<div>

    <nav class="navbar navbar-expand-lg navbar-light" style="background-color:darkturquoise; height: 1in;">
    <div class="container-fluid">
      <h2 style="padding-right: 5%;">Dealerships</h2>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" style="font-size: larger;" aria-current="page" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" style="font-size: larger;" href="/about">About Us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" style="font-size: larger;" href="/contact">Contact Us</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">

        <div class="title">
            <h1>Contact Us</h1>
        </div>

        <div class="card">

            <div class="row">

                <div class="details">
                    <h2>Get in Touch</h2>

                    <p>If you have any questions, feel free to contact us.</p>

                    <p>Email: support@example.com</p>

                    <p>Phone: +1 234 567 890</p>

                    <p>Address: 123 Main Street</p>
                </div>

            </div>

            <div class="form_panel">

                <h2 style="color:white;">Send us a Message</h2>

                <form method="POST">
                    {% csrf_token %}

                    <input type="text"
                           name="name"
                           placeholder="Your Name"
                           required>

                    <br><br>

                    <input type="email"
                           name="email"
                           placeholder="Your Email"
                           required>

                    <br><br>

                    <textarea name="message"
                              placeholder="Your Message"
                              rows="5"
                              required></textarea>

                    <br><br>

                    <button type="submit">
                        Send Message
                    </button>

                </form>

            </div>

        </div>

    </div>


</div>




</html>
